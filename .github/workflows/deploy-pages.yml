name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "public/**"
      - "scripts/gen-demo.mjs"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时重新构建（若配置了 LIVE_API_BASE 会刷新数据快照）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare static artifact
        env:
          LIVE_API_BASE: ${{ vars.LIVE_API_BASE }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          mkdir -p dist
          cp -r public/. dist/
          if [ -n "$LIVE_API_BASE" ]; then
            echo "Refreshing demo snapshot from $LIVE_API_BASE"
            node scripts/gen-demo.mjs dist
          else
            echo "Using committed public/demo.json snapshot"
          fi
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > dist/CNAME
          fi
          test -f dist/index.html || { echo "::error::index.html missing"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public URL
        run: |
          code=$(curl -sSL -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}")
          echo "HTTP $code"
          test "$code" = "200"

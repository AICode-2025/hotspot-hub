name = "hotspot-api"
main = "worker/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# D1 绑定：代码里统一用 env.DB
[[d1_databases]]
binding = "DB"
database_name = "hotspot"
database_id = "8a34b302-510a-4958-98e4-5d5334f34341"
migrations_dir = "worker/migrations"

# 每 10 分钟采集一批热榜；日报与指标按窗口在 scheduled 内判断
[triggers]
crons = ["*/10 * * * *"]

[vars]
# 公开只读 API：默认放行所有来源（含 IDE 预览、自定义域、移动端 WebView）。
# 如需收紧，改成逗号分隔的白名单，例如 "https://aicode-2025.github.io,http://localhost:8080"
ALLOW_ORIGINS = "*"
DEPLOYED_AT = ""

# 版本元数据：/api/v1/health 用 createdOn 反映真实部署时间（Git 构建与 CLI 部署都适用）
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="热点晨报 — 每天 60 秒读懂世界，49 路国内外热点源、真实排名走势、来源可追溯。" />
  <meta name="theme-color" content="#f6f1e4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
  <meta name="api-base" content="" />
  <title>热点晨报 · 每天 60 秒读懂世界</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23a8322a'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23f7f2e7' font-family='serif' font-weight='bold'%3E热%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
</head>
<body>
  <a class="skip-link" href="#viewHost">跳到主内容</a>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-today" viewBox="0 0 24 24"><path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-boards" viewBox="0 0 24 24"><path d="M4 19V9M9.5 19V5M15 19v-7M20.5 19v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-trends" viewBox="0 0 24 24"><path d="M4 17l5-6 4 3 6.5-8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-sources" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 20v-4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </svg>

  <div class="app-shell">
    <!-- 侧栏（桌面） -->
    <aside class="sidebar" aria-label="站点导航">
      <div class="brand-block">
        <span class="brand-seal" aria-hidden="true">热</span>
        <div class="brand-text">
          <p class="brand-title">热点晨报</p>
          <p class="brand-sub">HOTSPOT DESK</p>
        </div>
      </div>
      <div class="rule" role="presentation"></div>
      <nav class="side-nav" aria-label="功能模块">
        <ul class="nav-list" id="navList"></ul>
      </nav>
      <div class="side-foot">
        <div class="rule" role="presentation"></div>
        <p class="side-label">采集状态</p>
        <p class="side-status" id="sideStatus">正在检测…</p>
        <p class="side-label">日期</p>
        <p class="side-date" id="sideDate">—</p>
        <p class="side-credit">
          数据来自
          <a href="https://github.com/vikiboss/60s" target="_blank" rel="noopener">60s</a> ·
          <a href="https://github.com/newsnext/newsnow" target="_blank" rel="noopener">NewsNow</a>
        </p>
      </div>
    </aside>

    <!-- 主区 -->
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-titles">
          <p class="kicker" id="viewKicker">第 I 栏</p>
          <h1 class="view-title" id="viewTitle">今日晨报</h1>
        </div>
        <div class="topbar-tools">
          <div class="search-field">
            <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="globalSearch" type="search" placeholder="检索热点  ⌘K" autocomplete="off" spellcheck="false" aria-label="全站检索热点" />
            <button class="search-clear" id="searchClear" type="button" aria-label="清空检索" hidden>
              <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </div>
          <span class="mode-badge" id="modeBadge" data-mode="probing">检测中</span>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题" title="切换主题">
            <svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="重新采集" title="重新采集">
            <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
        </div>
      </header>

      <div class="mode-banner" id="modeBanner" role="status" hidden></div>

      <main id="viewHost" class="view-host" tabindex="-1"></main>

      <footer class="colophon">
        <div class="rule" role="presentation"></div>
        <p>内容由上游接口聚合，仅供参考。未接入的数据源不展示任何模拟热点。</p>
        <p class="colophon-meta" id="colophonMeta">—</p>
      </footer>
    </div>
  </div>

  <!-- 移动端底部 tab -->
  <nav class="tabbar" aria-label="移动端导航">
    <ul class="tab-list" id="tabList"></ul>
  </nav>

  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>
  <div class="dialog-root" id="dialogRoot"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
